name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        run: mvn -B test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/target/surefire-reports'
          retention-days: 14

  images:
    name: Service image builds
    runs-on: ubuntu-latest
    needs: [ test ]
    strategy:
      fail-fast: false
      matrix:
        service: [ api-gateway, booking-service, flight-ops-service, integration-service, ai-assistant-service ]
    steps:
      - uses: actions/checkout@v7
      # Imaj derlemesi, testlerin goremedigi kirilmalari yakalar: bir modul eklendiginde
      # Dockerfile'in reactor'u kurup kuramadigi ancak burada anlasilir.
      - name: Build ${{ matrix.service }} image
        run: docker build -f ${{ matrix.service }}/Dockerfile -t anadolu/${{ matrix.service }}:ci .
