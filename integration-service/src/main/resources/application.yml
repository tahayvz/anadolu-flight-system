server:
  port: 8081

spring:
  mail:
    # Lokalde MailHog: gercek SMTP gibi davranir, postayi disari cikarmaz,
    # http://localhost:8025 adresinde gosterir. Kimlik dogrulamasi istemez.
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  application:
    name: integration-service

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: integration-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.anadoluair.flight.events

# Actuator & Prometheus metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# Logging
logging:
  level:
    com.anadoluair.flight: DEBUG
    org.springframework.kafka: INFO
    org.springframework.ws: DEBUG

anadolu:
  notification:
    from: ${ANADOLU_NOTIFICATION_FROM:no-reply@anadoluair.example}
