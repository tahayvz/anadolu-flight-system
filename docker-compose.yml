version: '3.8'

services:
  # ============ INFRASTRUCTURE ============

  # Zookeeper - Required for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: anadolu-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # Production: Session timeout ve purge ayarları
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 1
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 3
      # Session management - eski broker kayıtlarını temizle
      ZOOKEEPER_MAX_SESSION_TIMEOUT: 60000
      ZOOKEEPER_MIN_SESSION_TIMEOUT: 6000
      # Enable 4-letter commands for healthcheck
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: ruok,stat,srvr
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - anadolu-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: anadolu-kafka
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      # Broker ID: -1 = auto-generate unique ID (prevents NodeExistsException)
      KAFKA_BROKER_ID: -1
      # Alternative: Use KAFKA_BROKER_ID_GENERATION_ENABLE for auto-generation
      KAFKA_BROKER_ID_GENERATION_ENABLE: "true"
      KAFKA_BROKER_RACK: "rack-1"

      # Zookeeper connection with session timeout
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 18000
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 18000

      # Listeners
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Replication settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1

      # Topic settings
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000

      # Performance & reliability
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000

      # Graceful shutdown - broker düzgün kapanınca Zookeeper kaydını temizler
      KAFKA_CONTROLLED_SHUTDOWN_ENABLE: "true"
      KAFKA_CONTROLLED_SHUTDOWN_MAX_RETRIES: 3

      # Leader election
      KAFKA_LEADER_IMBALANCE_CHECK_INTERVAL_SECONDS: 300
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - anadolu-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    # Production: Graceful shutdown
    stop_grace_period: 30s

  # Redis - Caching & Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: anadolu-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - anadolu-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zipkin - Distributed Tracing
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: anadolu-zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    networks:
      - anadolu-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka UI - Web interface for Kafka
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: anadolu-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: anadolu-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - anadolu-network

  # ============ API GATEWAY ============

  # API Gateway - Central entry point
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: anadolu-api-gateway
    depends_on:
      redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
      BOOKING_SERVICE_URL: http://booking-service:8083
      FLIGHT_OPS_URL: http://flight-ops-service:8082
      INTEGRATION_SERVICE_URL: http://integration-service:8081
    networks:
      - anadolu-network
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # AI Assistant - tool-calling agent over the flight services.
  # Varsayilan model SAHTEDIR: bu servis anahtarsiz, internetsiz ayaga kalkar.
  # Gercek model istiyorsan istekte model adini ve anahtarini gonder.
  ai-assistant-service:
    build:
      context: .
      dockerfile: ai-assistant-service/Dockerfile
    container_name: anadolu-ai-assistant-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      FLIGHT_OPS_URL: http://flight-ops-service:8082
      BOOKING_URL: http://booking-service:8083
      # Ollama konteynerde degil, gelistiricinin makinesinde calisir.
      OLLAMA_URL: http://host.docker.internal:11434
    networks:
      - anadolu-network
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============ MICROSERVICES ============

  # Integration Service - SOAP/XML Edge Layer
  integration-service:
    build:
      context: .
      dockerfile: integration-service/Dockerfile
    container_name: anadolu-integration-service
    depends_on:
      kafka:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_PROFILES_ACTIVE: docker
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    networks:
      - anadolu-network
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Flight Ops Service - WebSocket + Real-time
  flight-ops-service:
    build:
      context: .
      dockerfile: flight-ops-service/Dockerfile
    container_name: anadolu-flight-ops-service
    depends_on:
      kafka:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_PROFILES_ACTIVE: docker
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    networks:
      - anadolu-network
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Booking Service - REST API + JPA + Circuit Breaker
  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    container_name: anadolu-booking-service
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      flight-ops-service:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_PROFILES_ACTIVE: docker
      FLIGHT_OPS_URL: http://flight-ops-service:8082
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    networks:
      - anadolu-network
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============ MONITORING ============

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: anadolu-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus-alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - anadolu-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana - Metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: anadolu-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - anadolu-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MailHog — lokal SMTP yakalayici. Gercek bir posta sunucusu gibi davranir ama
  # postayi disari GONDERMEZ; web arayuzunde gosterir. Bildirimlerin gercekten
  # uretildigini gozle dogrulamayi saglar, kimseye posta gitmez.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: anadolu-mailhog
    ports:
      - "1025:1025"   # SMTP  — uygulama buraya gonderir
      - "8025:8025"   # Web   — http://localhost:8025
    networks:
      - anadolu-network
    restart: unless-stopped

networks:
  anadolu-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  redis-data:
  kafka-data:
  zookeeper-data:
  zookeeper-logs:
