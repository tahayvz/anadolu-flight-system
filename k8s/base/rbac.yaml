apiVersion: v1
kind: ServiceAccount
metadata:
  name: anadolu-service-account
  namespace: anadolu-flight-system
  labels:
    app.kubernetes.io/part-of: anadolu-flight-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: anadolu-service-role
  namespace: anadolu-flight-system
  labels:
    app.kubernetes.io/part-of: anadolu-flight-system
rules:
  # Allow reading ConfigMaps and Secrets (for Spring Cloud Kubernetes)
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]

  # Allow reading Service endpoints (for service discovery)
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]

  # Allow reading events for debugging
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: anadolu-service-rolebinding
  namespace: anadolu-flight-system
  labels:
    app.kubernetes.io/part-of: anadolu-flight-system
subjects:
  - kind: ServiceAccount
    name: anadolu-service-account
    namespace: anadolu-flight-system
roleRef:
  kind: Role
  name: anadolu-service-role
  apiGroup: rbac.authorization.k8s.io

---
# Network Policy - Zero Trust Security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: anadolu-network-policy
  namespace: anadolu-flight-system
  labels:
    app.kubernetes.io/part-of: anadolu-flight-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083

    # Allow internal traffic within namespace
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083

    # Allow Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083

  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Allow internal traffic
    - to:
        - podSelector: {}

    # Allow traffic to Kafka
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092

    # Allow traffic to Redis
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379

    # Allow traffic to Zipkin
    - to:
        - podSelector:
            matchLabels:
              app: zipkin
      ports:
        - protocol: TCP
          port: 9411

    # Allow traffic to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgresql
      ports:
        - protocol: TCP
          port: 5432
