# IMPORTANT: In production, use External Secrets Operator or Sealed Secrets
# This file is for reference only - DO NOT commit actual secrets!

apiVersion: v1
kind: Secret
metadata:
  name: anadolu-database-secrets
  namespace: anadolu-flight-system
  labels:
    app.kubernetes.io/part-of: anadolu-flight-system
type: Opaque
stringData:
  # PostgreSQL credentials (use for production)
  POSTGRES_HOST: "postgresql.anadolu-flight-system.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "thyflightdb"
  POSTGRES_USER: "thyapp"
  # In production, use external secrets manager
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # Connection string
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql.anadolu-flight-system.svc.cluster.local:5432/thyflightdb"
  SPRING_DATASOURCE_USERNAME: "thyapp"
  SPRING_DATASOURCE_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

---
apiVersion: v1
kind: Secret
metadata:
  name: anadolu-redis-secrets
  namespace: anadolu-flight-system
  labels:
    app.kubernetes.io/part-of: anadolu-flight-system
type: Opaque
stringData:
  # Redis password (if authentication enabled)
  REDIS_PASSWORD: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: anadolu-api-secrets
  namespace: anadolu-flight-system
  labels:
    app.kubernetes.io/part-of: anadolu-flight-system
type: Opaque
stringData:
  # API Gateway authentication
  API_KEY: "anadolu-api-key-2024"
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION_USE_256_BIT_KEY"

  # Kafka SASL credentials (if enabled)
  KAFKA_SASL_USERNAME: ""
  KAFKA_SASL_PASSWORD: ""
