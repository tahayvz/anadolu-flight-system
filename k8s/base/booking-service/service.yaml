apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: anadolu-flight-system
  labels:
    app.kubernetes.io/name: booking-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: anadolu-flight-system
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8083"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: booking-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
      protocol: TCP
