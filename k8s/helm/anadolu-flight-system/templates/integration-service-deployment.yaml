{{- if .Values.integrationService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.integrationService.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.integrationService.name }}
    app.kubernetes.io/component: integration
    {{- include "anadolu-flight-system.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.integrationService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.integrationService.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.integrationService.name }}
        app.kubernetes.io/component: integration
        {{- include "anadolu-flight-system.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: {{ include "anadolu-flight-system.serviceAccountName" . }}
      {{- include "anadolu-flight-system.podSecurityContext" . | nindent 6 }}
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ .Release.Name }}-kafka 9092; do echo waiting for kafka; sleep 2; done']
      containers:
        - name: {{ .Values.integrationService.name }}
          image: "{{ .Values.global.imageRegistry }}{{ .Values.integrationService.image.repository }}:{{ .Values.integrationService.image.tag }}"
          imagePullPolicy: {{ .Values.integrationService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            {{- include "anadolu-flight-system.commonEnv" . | nindent 12 }}
            - name: SERVER_PORT
              value: "8081"
          envFrom:
            - configMapRef:
                name: anadolu-common-config
          resources:
            {{- toYaml .Values.integrationService.resources | nindent 12 }}
          {{- include "anadolu-flight-system.containerSecurityContext" . | nindent 10 }}
          {{- include "anadolu-flight-system.livenessProbe" . | nindent 10 }}
          {{- include "anadolu-flight-system.readinessProbe" . | nindent 10 }}
          {{- include "anadolu-flight-system.startupProbe" . | nindent 10 }}
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ .Values.integrationService.name }}
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.integrationService.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.integrationService.name }}
    {{- include "anadolu-flight-system.labels" . | nindent 4 }}
spec:
  type: {{ .Values.integrationService.service.type }}
  selector:
    app.kubernetes.io/name: {{ .Values.integrationService.name }}
  ports:
    - name: http
      port: {{ .Values.integrationService.service.port }}
      targetPort: 8081
      protocol: TCP
{{- end }}
