{{- if .Values.security.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "anadolu-flight-system.serviceAccountName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "anadolu-flight-system.labels" . | nindent 4 }}
  {{- with .Values.security.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: anadolu-service-role
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "anadolu-flight-system.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: anadolu-service-rolebinding
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "anadolu-flight-system.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "anadolu-flight-system.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: anadolu-service-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
